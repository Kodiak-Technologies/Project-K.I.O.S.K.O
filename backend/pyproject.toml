[project]
name = "tienda-sistema-backend"
version = "0.1.0"
description = "Backend FastAPI del sistema de ventas e inventario (arquitectura hexagonal por módulo)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # Module D — Documentos
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "psycopg2-binary>=2.9",
    # Base IANA de zonas horarias: Windows no la trae y `zoneinfo` la necesita
    # para resolver la zona del negocio (ver shared/config/zona_horaria.py).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
