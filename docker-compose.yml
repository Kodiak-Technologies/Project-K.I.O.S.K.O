# Orquesta Postgres local + backend para desarrollo. No usar tal cual en producción (eso es Cloud Run + Cloud SQL).
version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda
      POSTGRES_DB: tienda_sistema
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
